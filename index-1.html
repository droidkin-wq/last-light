<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#040310">
<title>Last Light</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;}
#gc{position:fixed;inset:0;}
canvas{display:block;width:100%;height:100%;}

/* HUD TOP */
#hud{
  position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;
  background:linear-gradient(to bottom,rgba(4,3,16,0.92) 60%,transparent);
  z-index:20;pointer-events:none;
}
.hc{display:flex;flex-direction:column;align-items:center;gap:1px;}
.hl{font:700 7px/1 'Courier New',monospace;letter-spacing:2px;color:rgba(210,170,60,0.48);text-transform:uppercase;}
.hv{font:700 15px/1 'Courier New',monospace;color:#e8c85a;letter-spacing:1px;}
#clock{font-size:22px;}
#phase-txt{font:700 7px/1 'Courier New',monospace;letter-spacing:2px;color:rgba(210,170,60,0.48);text-transform:uppercase;margin-top:1px;}
#dread-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
#dbar-bg{width:78px;height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
#dbar{height:100%;width:0%;border-radius:2px;transition:width 1.5s ease;}

/* INVENTORY BAR */
#inv-bar{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px)+14px);
  left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:20;pointer-events:none;
}
.inv-slot{
  width:46px;height:46px;
  background:rgba(6,4,0,0.80);
  border:1.5px solid rgba(210,170,60,0.28);
  border-radius:7px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;
}
.inv-slot.has-item{border-color:rgba(210,170,60,0.65);}
.inv-icon{font-size:18px;line-height:1;}
.inv-count{font:700 9px/1 'Courier New',monospace;color:rgba(210,170,60,0.8);}

/* RESOURCE COUNTER */
#res-bar{
  position:absolute;top:calc(env(safe-area-inset-top,0px)+60px);
  left:0;right:0;
  display:flex;justify-content:center;gap:10px;
  z-index:20;pointer-events:none;
}
.res-pill{
  background:rgba(6,4,0,0.76);
  border:1px solid rgba(210,170,60,0.22);
  border-radius:20px;padding:3px 9px;
  display:flex;align-items:center;gap:4px;
  font:700 9px/1 'Courier New',monospace;color:#e8c85a;
}
.res-pill span{font-size:12px;}

/* LOOT POPUP */
#loot-popup{
  position:absolute;left:50%;transform:translateX(-50%);
  z-index:30;pointer-events:none;
  opacity:0;transition:opacity 0.3s ease;
  text-align:center;
}
#loot-popup .lp-icon{font-size:28px;}
#loot-popup .lp-txt{font:700 10px/1 'Courier New',monospace;letter-spacing:3px;color:#e8c85a;text-transform:uppercase;margin-top:3px;}

/* COLLECT PROGRESS */
#collect-bar-wrap{
  position:absolute;left:50%;transform:translateX(-50%);bottom:42%;
  width:120px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;
  z-index:25;opacity:0;transition:opacity 0.2s;
}
#collect-bar{height:100%;width:0%;background:linear-gradient(to right,#e8a030,#e8c85a);border-radius:3px;}

/* INTERACT HINT */
#interact-hint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:46%;
  font:700 9px/1 'Courier New',monospace;letter-spacing:3px;color:rgba(232,200,90,0.85);
  text-transform:uppercase;z-index:25;opacity:0;transition:opacity 0.4s;
  white-space:nowrap;pointer-events:none;
  animation:hint-pulse 1.4s ease-in-out infinite;
}
@keyframes hint-pulse{0%,100%{opacity:0.5}50%{opacity:1}}

/* NIGHT WARNING */
#warn{
  position:absolute;top:38%;left:50%;transform:translateX(-50%);
  z-index:25;font:700 10px/1 'Courier New',monospace;letter-spacing:4px;
  color:rgba(232,80,30,0.95);text-transform:uppercase;
  text-shadow:0 0 14px rgba(232,64,0,0.9);
  opacity:0;transition:opacity 2s ease;white-space:nowrap;pointer-events:none;
  animation:pw 2.2s ease-in-out infinite;
}
@keyframes pw{0%,100%{filter:brightness(0.7)}50%{filter:brightness(1.4)}}

/* ZOMBIE ALERT */
#z-alert{
  position:absolute;top:44%;left:50%;transform:translateX(-50%);
  z-index:25;font:700 10px/1 'Courier New',monospace;letter-spacing:3px;
  color:rgba(220,40,20,0.95);text-transform:uppercase;
  text-shadow:0 0 16px rgba(220,20,0,1);
  opacity:0;transition:opacity 0.5s ease;white-space:nowrap;pointer-events:none;
}

/* FLOATING JOYSTICK */
#joy-zone{
  position:absolute;left:0;top:0;width:55%;height:100%;
  z-index:15;touch-action:none;
}
#joy-outer{
  position:absolute;width:100px;height:100px;
  border-radius:50%;background:rgba(210,170,60,0.08);
  border:2px solid rgba(210,170,60,0.25);
  display:none;pointer-events:none;z-index:16;
  transform:translate(-50%,-50%);
}
#joy-inner{
  position:absolute;width:42px;height:42px;
  border-radius:50%;background:rgba(210,170,60,0.35);
  border:1.5px solid rgba(210,170,60,0.6);
  pointer-events:none;z-index:17;
  transform:translate(-50%,-50%);
  box-shadow:0 0 12px rgba(210,170,60,0.2);
}

/* SPEED */
#spd-row{
  position:absolute;top:calc(env(safe-area-inset-top,0px)+60px);
  right:12px;z-index:20;display:flex;flex-direction:column;gap:4px;
}
.sb{
  background:rgba(8,5,0,0.72);border:1.5px solid rgba(210,170,60,0.22);
  border-radius:5px;padding:5px 9px;
  font:700 9px/1 'Courier New',monospace;letter-spacing:1px;
  color:rgba(210,170,60,0.5);cursor:pointer;
}
.sb.active{border-color:rgba(210,170,60,0.82);color:#e8c85a;background:rgba(42,22,0,0.88);}

/* INTRO */
#intro{
  position:absolute;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(4,3,16,0.95);transition:opacity 1.2s ease;
}
#intro.gone{opacity:0;pointer-events:none;}
.it{font:900 clamp(38px,11vw,62px)/1 'Courier New',monospace;letter-spacing:6px;color:#e8c85a;text-transform:uppercase;text-shadow:0 0 40px rgba(232,200,90,0.32);margin-bottom:5px;}
.is{font:400 10px/1 'Courier New',monospace;letter-spacing:6px;color:rgba(210,170,60,0.38);text-transform:uppercase;margin-bottom:8px;}
.iv{font:400 8px/1 'Courier New',monospace;letter-spacing:3px;color:rgba(210,170,60,0.22);text-transform:uppercase;margin-bottom:36px;}
.ib{background:transparent;border:1px solid rgba(210,170,60,0.5);color:#e8c85a;font:700 11px/1 'Courier New',monospace;letter-spacing:4px;text-transform:uppercase;padding:14px 34px;border-radius:4px;cursor:pointer;}
.ib:active{background:rgba(210,170,60,0.07);}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>

  <!-- HUD top -->
  <div id="hud">
    <div class="hc">
      <div class="hl">Time</div>
      <div class="hv" id="clock">06:00</div>
      <div id="phase-txt">Dawn</div>
    </div>
    <div class="hc">
      <div class="hv" id="sea-icon">🌱</div>
      <div class="hv" id="wx-icon">☀️</div>
    </div>
    <div id="dread-wrap">
      <div class="hl" id="dlbl" style="color:#5ad05a">Safe</div>
      <div id="dbar-bg"><div id="dbar"></div></div>
      <div class="hl">Day <span id="dayn">1</span></div>
    </div>
  </div>

  <!-- Resource counters -->
  <div id="res-bar">
    <div class="res-pill"><span>🪵</span><span id="r-wood">0</span></div>
    <div class="res-pill"><span>🥫</span><span id="r-food">0</span></div>
    <div class="res-pill"><span>⚙️</span><span id="r-metal">0</span></div>
    <div class="res-pill"><span>💊</span><span id="r-med">0</span></div>
  </div>

  <!-- Night/zombie alerts -->
  <div id="warn">⚠ Night Approaches ⚠</div>
  <div id="z-alert">☠ THEY ARE CLOSE ☠</div>

  <!-- Interact hint -->
  <div id="interact-hint">Hold to Scavenge</div>

  <!-- Collect progress -->
  <div id="collect-bar-wrap"><div id="collect-bar"></div></div>

  <!-- Loot popup -->
  <div id="loot-popup">
    <div class="lp-icon" id="lp-icon">🪵</div>
    <div class="lp-txt" id="lp-txt">Wood +2</div>
  </div>

  <!-- Inventory bar -->
  <div id="inv-bar">
    <div class="inv-slot" id="inv-0"><div class="inv-icon">—</div><div class="inv-count"></div></div>
    <div class="inv-slot" id="inv-1"><div class="inv-icon">—</div><div class="inv-count"></div></div>
    <div class="inv-slot" id="inv-2"><div class="inv-icon">—</div><div class="inv-count"></div></div>
    <div class="inv-slot" id="inv-3"><div class="inv-icon">—</div><div class="inv-count"></div></div>
  </div>

  <!-- Floating joystick -->
  <div id="joy-zone"></div>
  <div id="joy-outer"></div>
  <div id="joy-inner"></div>

  <!-- Speed -->
  <div id="spd-row">
    <div class="sb" data-s="1">1×</div>
    <div class="sb active" data-s="4">4×</div>
    <div class="sb" data-s="15">15×</div>
  </div>

  <!-- Intro -->
  <div id="intro">
    <div class="it">Last Light</div>
    <div class="is">Survive the Dark</div>
    <div class="iv">v2 · Scavenge & Build</div>
    <button class="ib" id="sbtn">Begin</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════════════════
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
let W,H;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

// ═══════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════
const REAL_DAY_S=12;
let spd=4,running=false;
let gt=0.26,day=1,season=0;
let weather='clear',wxT=90;
const WX=['clear','clear','clear','cloudy','rain','fog','storm'];
const WICON={clear:'☀️',cloudy:'⛅',rain:'🌧️',fog:'🌫️',storm:'⛈️'};
const SICON=['🌱','☀️','🍂','❄️'];

// Resources (stockpiled at base)
const RES={wood:0,food:0,metal:0,med:0};
// Carried inventory [{type,icon,qty}]
const INV=[null,null,null,null];
// Loot zones
const LOOT_ZONES=[];
// Zombies
const ZOMBIES=[];
// Particles
const PARTS=[];
// Base upgrade level 0=wood 1=reinforced 2=metal
let baseLevel=0;
// Collect state
let collecting=false,collectTarget=null,collectProgress=0,collectTime=2.2;
// Proximity hint
let nearZone=null;

// ═══════════════════════════════════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════════════════════════════════
const PL={gx:0.5,gy:0.5,vx:0,vy:0};

// ═══════════════════════════════════════════════════════════════════
//  ISO
// ═══════════════════════════════════════════════════════════════════
const TW=78,TH=39;
function ox(){return W*0.5;}
function oy(){return H*0.46;}
function iso(gx,gy){return{x:ox()+(gx-gy)*(TW/2),y:oy()+(gx+gy)*(TH/2)};}
function screenDist(gx,gy,gx2,gy2){
  const a=iso(gx,gy),b=iso(gx2,gy2);
  return Math.hypot(a.x-b.x,a.y-b.y);
}

// ═══════════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════════
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function sr(s){const x=Math.sin(s+1)*10000;return x-Math.floor(x);}
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lhex(a,b,t){const[r1,g1,b1]=h2r(a),[r2,g2,b2]=h2r(b);return`rgb(${~~lerp(r1,r2,t)},${~~lerp(g1,g2,t)},${~~lerp(b1,b2,t)})`;}
function abl(hex,gc,a=0.4){const[r,g,b]=h2r(hex);return`rgb(${~~(r*(1-a)+gc[0]*a)},${~~(g*(1-a)+gc[1]*a)},${~~(b*(1-a)+gc[2]*a)})`;}
function gridDist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}

// ═══════════════════════════════════════════════════════════════════
//  PALETTE
// ═══════════════════════════════════════════════════════════════════
const PAL=[
  {t:0.00,sT:'#040310',sB:'#0a0520',am:'#1a1235',su:0.00},
  {t:0.10,sT:'#0a0520',sB:'#1a0a30',am:'#251845',su:0.05},
  {t:0.22,sT:'#0d0828',sB:'#2a1545',am:'#2d1e55',su:0.08},
  {t:0.25,sT:'#2a0d35',sB:'#5a2060',am:'#4d3a7a',su:0.14},
  {t:0.28,sT:'#7b2a10',sB:'#c05028',am:'#8a6030',su:0.32},
  {t:0.33,sT:'#d46020',sB:'#f0a040',am:'#c09050',su:0.62},
  {t:0.40,sT:'#5ab0e8',sB:'#c0e0f8',am:'#e8d890',su:0.90},
  {t:0.50,sT:'#2a80d8',sB:'#80c8f0',am:'#f8f0d8',su:1.00},
  {t:0.62,sT:'#3898dc',sB:'#90d0f0',am:'#f0e0c0',su:0.94},
  {t:0.70,sT:'#d46020',sB:'#f09040',am:'#e0b060',su:0.68},
  {t:0.75,sT:'#7b2a10',sB:'#b04028',am:'#904830',su:0.38},
  {t:0.79,sT:'#280820',sB:'#4a1535',am:'#35153a',su:0.12},
  {t:0.85,sT:'#0d0520',sB:'#1a0828',am:'#1a1030',su:0.04},
  {t:1.00,sT:'#040310',sB:'#0a0520',am:'#1a1235',su:0.00},
];
function getP(t){
  for(let i=0;i<PAL.length-1;i++){
    if(t>=PAL[i].t&&t<=PAL[i+1].t){
      const f=(t-PAL[i].t)/(PAL[i+1].t-PAL[i].t);
      return{sT:lhex(PAL[i].sT,PAL[i+1].sT,f),sB:lhex(PAL[i].sB,PAL[i+1].sB,f),am:lhex(PAL[i].am,PAL[i+1].am,f),su:lerp(PAL[i].su,PAL[i+1].su,f)};
    }
  }
  return PAL[0];
}

// ═══════════════════════════════════════════════════════════════════
//  SEASON
// ═══════════════════════════════════════════════════════════════════
const SG=[
  {b:'#6a8c4a',a:'#4a7c2a',r:'#8a7860'},
  {b:'#5a8040',a:'#3a6c1a',r:'#9a8870'},
  {b:'#8a6430',a:'#c08028',r:'#8a7060'},
  {b:'#b8c8d0',a:'#a0b8c8',r:'#888898'},
];
const FOL=[
  ['#3a6c1a','#4a8c2a','#2a5c0a'],
  ['#2a6010','#388020','#1a5008'],
  ['#b86810','#d08020','#8a4808'],
  ['#c8d0d8','#a0b0b8','#8098a8'],
];

// ═══════════════════════════════════════════════════════════════════
//  WORLD
// ═══════════════════════════════════════════════════════════════════
const GS=10;
const TILES=[],STRUCTS=[],TREES=[];

function buildWorld(){
  for(let y=-GS;y<=GS;y++) for(let x=-GS;x<=GS;x++){
    let t=0;
    if(x===0||y===0)t=1;
    if(x>=4&&x<=6&&y>=3&&y<=6)t=3;
    if((x===-3&&y===-3)||(x===5&&y===-2))t=2;
    TILES.push({x,y,t});
  }
  STRUCTS.push({gx:0,gy:0,tp:'shack'});
  STRUCTS.push({gx:-3,gy:2,tp:'ruin'});
  STRUCTS.push({gx:-5,gy:-1,tp:'tower'});
  STRUCTS.push({gx:2,gy:-2,tp:'fence'});

  [[-4,-3],[-3,-5],[1,-4],[6,-3],[7,-1],[-7,2],[-6,-4],[4,5],[-1,6],
   [-8,-2],[2,7],[6,6],[-5,5],[0,-7],[5,-6],[-2,-8]].forEach(([tx,ty])=>{
    TREES.push({gx:tx,gy:ty,v:~~(sr(tx*7+ty)*3),h:0.85+sr(tx*13+ty)*0.5,l:(sr(tx*3+ty)-0.5)*0.1});
  });

  // Loot zones — scattered around map
  const lootDefs=[
    {gx:-4,gy:-2,type:'crate',loot:'wood',icon:'🪵',qty:[2,4]},
    {gx:3,gy:-4,type:'car',loot:'metal',icon:'⚙️',qty:[1,3]},
    {gx:-2,gy:4,type:'bag',loot:'food',icon:'🥫',qty:[1,3]},
    {gx:5,gy:-5,type:'box',loot:'wood',icon:'🪵',qty:[1,3]},
    {gx:-6,gy:3,type:'crate',loot:'med',icon:'💊',qty:[1,2]},
    {gx:7,gy:2,type:'car',loot:'metal',icon:'⚙️',qty:[2,3]},
    {gx:-4,gy:-6,type:'bag',loot:'food',icon:'🥫',qty:[2,4]},
    {gx:2,gy:6,type:'box',loot:'wood',icon:'🪵',qty:[3,5]},
  ];
  lootDefs.forEach(d=>{
    LOOT_ZONES.push({...d,depleted:false,respawnTimer:0,pulseT:0});
  });

  // Zombies (dormant at day)
  [[-7,-5],[8,1],[-2,8],[6,-7],[-8,5]].forEach(([zx,zy],i)=>{
    ZOMBIES.push({gx:zx,gy:zy,startGx:zx,startGy:zy,
      active:false,alert:false,alertTimer:0,
      speed:0.022+i*0.003,variant:i%3});
  });
}
buildWorld();

function spawnParts(){
  PARTS.length=0;
  if(weather==='rain'||weather==='storm')
    for(let i=0;i<100;i++) PARTS.push({x:Math.random()*W,y:Math.random()*H,sp:5+Math.random()*5,ln:8+Math.random()*9,a:0.22+Math.random()*0.32,tp:'r'});
  if(weather==='fog')
    for(let i=0;i<12;i++) PARTS.push({x:Math.random()*W,y:H*0.28+Math.random()*H*0.52,r:90+Math.random()*190,sp:0.15+Math.random()*0.22,a:0.04+Math.random()*0.05,tp:'f'});
}

// ═══════════════════════════════════════════════════════════════════
//  AUDIO ENGINE — procedural Web Audio
// ═══════════════════════════════════════════════════════════════════
let aCtx=null;
const AUD={
  dayOsc:null,dayGain:null,
  nightDrone:null,nightGain:null,
  nightPerc:null,
  tension:null,tensionGain:null,
  heartbeat:null,hbGain:null,
  masterGain:null,
};
let audioReady=false;
let musicState='day'; // day | dusk | night | zombie
let musicTimer=0;
let noteIdx=0;

// Pentatonic scale for day melody (C maj pentatonic)
const DAY_NOTES=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
// Minor scale for night
const NIGHT_NOTES=[220,246.94,261.63,293.66,329.63,349.23,392.00,440];

function initAudio(){
  try{
    aCtx=new(window.AudioContext||window.webkitAudioContext)();
    AUD.masterGain=aCtx.createGain();AUD.masterGain.gain.value=0.55;AUD.masterGain.connect(aCtx.destination);

    // Day melody osc (plucked feel via gain envelope)
    AUD.dayGain=aCtx.createGain();AUD.dayGain.gain.value=0;
    const dayLpf=aCtx.createBiquadFilter();dayLpf.type='lowpass';dayLpf.frequency.value=1800;
    AUD.dayGain.connect(dayLpf);dayLpf.connect(AUD.masterGain);

    // Night drone
    AUD.nightDrone=aCtx.createOscillator();AUD.nightDrone.type='sawtooth';AUD.nightDrone.frequency.value=55;
    AUD.nightGain=aCtx.createGain();AUD.nightGain.gain.value=0;
    const nLpf=aCtx.createBiquadFilter();nLpf.type='lowpass';nLpf.frequency.value=160;
    AUD.nightDrone.connect(nLpf);nLpf.connect(AUD.nightGain);AUD.nightGain.connect(AUD.masterGain);
    AUD.nightDrone.start();

    // Tension hum (near zombie / dusk)
    AUD.tension=aCtx.createOscillator();AUD.tension.type='triangle';AUD.tension.frequency.value=110;
    AUD.tensionGain=aCtx.createGain();AUD.tensionGain.gain.value=0;
    const tLpf=aCtx.createBiquadFilter();tLpf.type='lowpass';tLpf.frequency.value=300;
    AUD.tension.connect(tLpf);tLpf.connect(AUD.tensionGain);AUD.tensionGain.connect(AUD.masterGain);
    AUD.tension.start();

    // Heartbeat (zombie very close)
    AUD.hbGain=aCtx.createGain();AUD.hbGain.gain.value=0;
    AUD.hbGain.connect(AUD.masterGain);

    audioReady=true;
  }catch(e){console.log('Audio init failed:',e);}
}

function playNote(freq,gain,dur,type='sine'){
  if(!audioReady||!aCtx) return;
  const o=aCtx.createOscillator();
  const g=aCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,aCtx.currentTime);
  g.gain.linearRampToValueAtTime(gain,aCtx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+dur);
  o.connect(g);g.connect(AUD.masterGain);
  o.start();o.stop(aCtx.currentTime+dur+0.05);
}

function playHeartbeat(){
  if(!audioReady) return;
  playNote(80,0.18,0.08,'sine');
  setTimeout(()=>playNote(70,0.12,0.06,'sine'),100);
}

function playLootSound(){
  if(!audioReady) return;
  playNote(523.25,0.12,0.1,'sine');
  setTimeout(()=>playNote(659.25,0.10,0.15,'sine'),80);
  setTimeout(()=>playNote(783.99,0.08,0.2,'sine'),160);
}

let dayNoteTimer=0,nightNoteTimer=0,hbTimer=0;

function updateAudio(dt,dreadVal,zombieNear){
  if(!audioReady||!aCtx) return;
  const now=aCtx.currentTime;
  const isNight=gt>0.78||gt<0.28;
  const isDusk=gt>0.68&&gt<=0.78;

  // Day melody — gentle arpeggiated notes
  if(!isNight&&!isDusk){
    dayNoteTimer-=dt;
    if(dayNoteTimer<=0){
      const note=DAY_NOTES[noteIdx%DAY_NOTES.length];
      noteIdx++;
      playNote(note,0.06,0.35+(Math.random()*0.3),'sine');
      // Occasional harmony
      if(Math.random()<0.3) setTimeout(()=>playNote(note*1.5,0.03,0.25,'sine'),200);
      dayNoteTimer=0.4+Math.random()*0.6;
    }
    AUD.nightGain.gain.linearRampToValueAtTime(0,now+1.5);
    AUD.tensionGain.gain.linearRampToValueAtTime(0,now+2);
  }

  // Dusk — transition, tension rises
  if(isDusk){
    const duskFrac=(gt-0.68)/0.10;
    AUD.tensionGain.gain.linearRampToValueAtTime(0.018*duskFrac,now+2);
    AUD.tension.frequency.linearRampToValueAtTime(90+duskFrac*30,now+3);
    nightNoteTimer-=dt;
    if(nightNoteTimer<=0){
      const note=NIGHT_NOTES[~~(Math.random()*NIGHT_NOTES.length)];
      playNote(note*0.5,0.04,0.6,'sawtooth');
      nightNoteTimer=1.2+Math.random()*1.5;
    }
  }

  // Night — drone + irregular minor stabs
  if(isNight){
    AUD.nightGain.gain.linearRampToValueAtTime(0.038,now+2);
    AUD.nightDrone.frequency.linearRampToValueAtTime(44+dreadVal*18,now+3);
    AUD.tensionGain.gain.linearRampToValueAtTime(0.022,now+2);
    nightNoteTimer-=dt;
    if(nightNoteTimer<=0){
      // Irregular percussive night stabs
      const note=NIGHT_NOTES[~~(Math.random()*NIGHT_NOTES.length)];
      playNote(note*0.5,0.055,0.8,'sawtooth');
      if(Math.random()<0.4) playNote(note*0.25,0.04,1.2,'sawtooth');
      nightNoteTimer=0.8+Math.random()*2.2;
    }
  }

  // Zombie nearby — heartbeat
  if(zombieNear){
    AUD.tensionGain.gain.linearRampToValueAtTime(0.04,now+0.5);
    hbTimer-=dt;
    if(hbTimer<=0){
      playHeartbeat();
      hbTimer=zombieNear<2?0.5:zombieNear<3?0.8:1.2;
    }
  } else {
    hbTimer=1.5;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════════════════
function diamond(px,py,w,h,fill,stroke,lw=0.7){
  ctx.beginPath();
  ctx.moveTo(px,py-h/2);ctx.lineTo(px+w/2,py);ctx.lineTo(px,py+h/2);ctx.lineTo(px-w/2,py);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();
}
function box(px,py,bw,bh,d,cT,cF,cS,cStr){
  ctx.strokeStyle=cStr;ctx.lineWidth=1.0;
  ctx.fillStyle=cT;ctx.beginPath();
  ctx.moveTo(px,py-d);ctx.lineTo(px+bw/2,py-d+bh/2);ctx.lineTo(px,py-d+bh);ctx.lineTo(px-bw/2,py-d+bh/2);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=cF;ctx.beginPath();
  ctx.moveTo(px-bw/2,py-d+bh/2);ctx.lineTo(px,py-d+bh);ctx.lineTo(px,py);ctx.lineTo(px-bw/2,py-d+bh/2+d);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=cS;ctx.beginPath();
  ctx.moveTo(px,py-d+bh);ctx.lineTo(px+bw/2,py-d+bh/2);ctx.lineTo(px+bw/2,py-d+bh/2+d);ctx.lineTo(px,py);
  ctx.closePath();ctx.fill();ctx.stroke();
}

//  SKY
// ═══════════════════════════════════════════════════════════════════
function drawSky(p){
  const g=ctx.createLinearGradient(0,0,0,H*0.62);
  g.addColorStop(0,p.sT);g.addColorStop(1,p.sB);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const night=Math.max(0,1-p.su*3.5);
  if(night>0.08){
    ctx.save();ctx.globalAlpha=night*0.8;
    for(let i=0;i<80;i++){ctx.beginPath();ctx.arc(sr(i*7)*W,sr(i*13)*H*0.52,sr(i*3)*1.3+0.2,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,240,${0.4+sr(i)*0.6})`;ctx.fill();}
    ctx.restore();
  }
  if(night>0.12){
    const mx=W*0.76,my=H*0.10,mr=17;
    ctx.save();ctx.globalAlpha=night*0.88;
    const mg=ctx.createRadialGradient(mx,my,mr,mx,my,mr*4.5);
    mg.addColorStop(0,'rgba(220,210,180,0.13)');mg.addColorStop(1,'rgba(220,210,180,0)');
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mr*4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e8e0c8';ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  if(p.su>0.04){
    const sf=clamp((gt-0.25)/0.5,0,1);
    const sx=W*(0.12+sf*0.76),sy=H*(0.37-Math.sin(sf*Math.PI)*0.25);
    ctx.save();ctx.globalAlpha=Math.min(1,p.su*1.12);
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,TW*2.4);
    sg.addColorStop(0,'rgba(255,252,200,1)');sg.addColorStop(0.12,'rgba(255,220,120,0.52)');
    sg.addColorStop(0.45,'rgba(255,160,40,0.09)');sg.addColorStop(1,'rgba(255,120,0,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,TW*2.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,220,0.93)';ctx.beginPath();ctx.arc(sx,sy,13,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════
function drawGround(gc,p){
  const sorted=[...TILES].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  const sg=SG[season];const now=performance.now()*0.001;
  sorted.forEach(tl=>{
    const{x:px,y:py}=iso(tl.x,tl.y);
    if(px<-TW||px>W+TW||py<-TH||py>H+TH) return;
    let fill,stroke;
    switch(tl.t){
      case 0:fill=abl(sg.b,gc,0.42);stroke=abl(sg.a,gc,0.32);break;
      case 1:fill=abl(sg.r,gc,0.42);stroke=abl('#6a5840',gc,0.32);break;
      case 2:fill=abl('#7a6858',gc,0.42);stroke=abl('#5a4838',gc,0.32);break;
      case 3:{const wb=p.su>0.35?'#3a7ab8':p.su>0.1?'#1a3a68':'#0a1838';fill=abl(wb,gc,0.22);stroke=abl('#2a5a98',gc,0.22);}break;
      default:fill=sg.b;stroke=sg.a;
    }
    diamond(px,py,TW,TH,fill,stroke,0.65);
    if(season===3){ctx.save();ctx.globalAlpha=0.44;diamond(px,py,TW,TH,'rgba(224,232,244,0.60)','transparent');ctx.restore();}
    if(tl.t===3&&p.su>0.22){
      ctx.save();ctx.globalAlpha=0.12*p.su;ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=0.6;
      ctx.beginPath();ctx.moveTo(px-9+Math.sin(now+tl.x)*3,py-1);ctx.lineTo(px+9+Math.sin(now+tl.x*0.7)*2,py-1);ctx.stroke();ctx.restore();
    }
  });
}

const LOOT_ICONS={crate:'📦',car:'🚗',bag:'🎒',box:'🗃️'};

function drawLootZones(p,now){
  LOOT_ZONES.forEach(lz=>{
    if(lz.depleted) return;
    const{x:px,y:py}=iso(lz.gx,lz.gy);
    lz.pulseT+=0.04;
    const pulse=0.5+Math.sin(lz.pulseT)*0.5;
    const dist=gridDist(PL.gx,PL.gy,lz.gx,lz.gy);
    const near=dist<2.2;

    // Ground ring glow
    ctx.save();
    ctx.globalAlpha=(near?0.5:0.25)*pulse;
    const rg=ctx.createRadialGradient(px,py,4,px,py,TW*0.7);
    const col=near?'rgba(232,200,90':'rgba(100,180,100';
    rg.addColorStop(0,`${col},0.4)`);rg.addColorStop(1,`${col},0)`);
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(px,py,TW*0.7,0,Math.PI*2);ctx.fill();
    ctx.restore();

    // Floating icon above
    ctx.save();
    ctx.globalAlpha=near?0.95:0.65+pulse*0.2;
    const floatY=py-TH*1.2-Math.sin(now*2+lz.gx)*4;
    ctx.font=`${near?22:16}px serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(LOOT_ICONS[lz.type],px,floatY);

    // Near: show loot type
    if(near&&p.su>0.1){
      ctx.font='bold 8px Courier New';ctx.fillStyle='rgba(232,200,90,0.9)';
      ctx.fillText(lz.icon,px,floatY-18);
    }
    ctx.restore();
  });
}

function drawStructs(gc,p){
  STRUCTS.forEach(s=>{

    if(s.tp==='shack'){
      // Base upgrades visually

      // Roof
      ctx.save();
      ctx.fillStyle=abl(baseLevel===0?'#4a2810':baseLevel===1?'#3a4020':'#304040',gc,0.38);
      ctx.strokeStyle=abl('#2a1808',gc,0.22);ctx.lineWidth=1.4;
      const ry=py-TH*2.8-TH;
      ctx.beginPath();ctx.moveTo(px-TW*0.95,ry+TH);ctx.lineTo(px,ry);ctx.lineTo(px+TW*0.95,ry+TH);ctx.lineTo(px,ry+TH*1.9);ctx.closePath();
      ctx.fill();ctx.stroke();ctx.restore();

      // Upgrade badge
      if(baseLevel>0){
        ctx.save();ctx.font='bold 9px Courier New';ctx.textAlign='center';
        ctx.fillStyle='rgba(232,200,90,0.8)';
        ctx.fillText(['','🔧','⚙️'][baseLevel],px,py-TH*4.2);ctx.restore();
      }

      // Deposit zone ring
      ctx.save();ctx.globalAlpha=0.22+Math.sin(performance.now()*0.002)*0.08;
      ctx.strokeStyle='rgba(232,200,90,0.6)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.ellipse(px,py+4,TW*0.9,TH*0.7,0,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();

      // Window glow at night
      if(p.su<0.4){
        ctx.save();ctx.globalAlpha=(0.4-p.su)*2.1;
        ctx.fillStyle='rgba(255,200,80,0.75)';ctx.fillRect(px-TW*0.4,py-TH*1.7,TW*0.28,TH*0.56);
        const wg=ctx.createRadialGradient(px-TW*0.26,py-TH*1.42,2,px-TW*0.26,py-TH*1.42,TW*0.65);
        wg.addColorStop(0,'rgba(255,180,40,0.22)');wg.addColorStop(1,'rgba(255,180,40,0)');
        ctx.fillStyle=wg;ctx.fillRect(px-TW*1.1,py-TH*2.9,TW*2.2,TH*2.2);ctx.restore();
      }
    }
    else if(s.tp==='ruin'){
      box(px,py,TW*1.7,TH*1.1,TH*1.6,abl('#888070',gc,0.32),abl('#504840',gc,0.32),abl('#686060',gc,0.32),abl('#302820',gc,0.22));
      ctx.save();ctx.fillStyle=abl('#706050',gc,0.32);ctx.strokeStyle=abl('#403828',gc,0.22);ctx.lineWidth=0.65;
      for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(px+(sr(i*7)-0.5)*TW,py+sr(i*13)*TH*0.62,3+sr(i*3)*5,0,Math.PI*2);ctx.fill();ctx.stroke();}
      ctx.restore();
    }
    else if(s.tp==='tower'){
      box(px,py,TW*0.95,TH*0.95,TH*5,abl('#a09080',gc,0.32),abl('#484040',gc,0.32),abl('#606058',gc,0.32),abl('#282020',gc,0.22));
      if(p.su<0.3){
        const fl=0.55+Math.sin(performance.now()*0.003)*0.45;
        ctx.save();ctx.globalAlpha=(0.3-p.su)*2.2*fl;
        const lg=ctx.createRadialGradient(px,py-TH*5,2,px,py-TH*5,52);
        lg.addColorStop(0,'rgba(255,60,0,0.9)');lg.addColorStop(1,'rgba(255,0,0,0)');
        ctx.fillStyle=lg;ctx.beginPath();ctx.arc(px,py-TH*5,52,0,Math.PI*2);ctx.fill();ctx.restore();
      }
    }
    else if(s.tp==='fence'){
      for(let i=-3;i<=3;i++){
        const fp=iso(s.gx+i*0.5,s.gy);
        ctx.save();ctx.strokeStyle=abl('#6a4a28',gc,0.32);ctx.lineWidth=2.5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(fp.x,fp.y);ctx.lineTo(fp.x,fp.y-TH*1.5);ctx.stroke();ctx.restore();
      }
    }
  });
}

function drawTrees(gc){

  [...TREES].sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy)).forEach(tr=>{
    const{x:px,y:py}=iso(tr.gx,tr.gy);

    ctx.save();ctx.strokeStyle=abl('#5a3a18',gc,0.38);ctx.lineWidth=2.5+tr.h;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+tr.l*tH*20,py-trH);ctx.stroke();ctx.restore();
    const layers=tr.v===0?3:tr.v===1?2:4;
    for(let l=0;l<layers;l++){
      const ly=py-trH-(tH-trH)*(l/layers)*0.88;
      const lr=(TW*0.38*tr.h)*(1-l/layers*0.28);
      ctx.save();ctx.globalAlpha=0.88;
      for(let k=0;k<3;k++){
        ctx.fillStyle=abl(fc[l%fc.length],gc,0.45);ctx.strokeStyle=abl('#2a3a10',gc,0.3);ctx.lineWidth=0.65;
        ctx.beginPath();ctx.arc(px+(sr(tr.gx*7+l*3+k)*2-1)*lr*0.38+tr.l*tH*20*(1-l/layers),
          ly+(sr(tr.gy*11+l*5+k)*2-1)*lr*0.28,lr*(0.72+sr(k*17)*0.38),0,Math.PI*2);
        ctx.fill();ctx.stroke();
      }
      ctx.restore();

}

// ═══════════════════════════════════════════════════════════════════
const Z_COLS=[['#3a4a20','#506030'],['#4a3020','#604030'],['#2a3a40','#304050']];

function drawZombies(gc,p){
  const isNight=gt>0.78||gt<0.28;
  ZOMBIES.forEach(z=>{
    if(!isNight&&!z.active) return; // hidden during full day
    const{x:px,y:py}=iso(z.gx,z.gy);
    const nightAmt=Math.max(0,isNight?1:0);
    const dist=gridDist(PL.gx,PL.gy,z.gx,z.gy);
    const alerted=dist<4;

    // Glow if alerting
    if(alerted&&isNight){
      ctx.save();ctx.globalAlpha=0.3;
      const zg=ctx.createRadialGradient(px,py,2,px,py,40);
      zg.addColorStop(0,'rgba(200,30,10,0.5)');zg.addColorStop(1,'rgba(200,0,0,0)');
      ctx.fillStyle=zg;ctx.beginPath();ctx.arc(px,py,40,0,Math.PI*2);ctx.fill();ctx.restore();
    }

    // Zombie silhouette — sketch style
    ctx.save();ctx.globalAlpha=isNight?0.92:0.4;
    const [c1,c2]=Z_COLS[z.variant];
    // Legs
    ctx.strokeStyle=abl('#1a1008',gc,0.2);ctx.lineWidth=3;ctx.lineCap='round';
    const sway=Math.sin(performance.now()*0.003+z.gx)*2;
    ctx.beginPath();ctx.moveTo(px-3+sway,py);ctx.lineTo(px-5,py+10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+3+sway,py);ctx.lineTo(px+5,py+10);ctx.stroke();
    // Arms outstretched
    ctx.strokeStyle=abl(c1,gc,0.3);ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(px-6,py-8);ctx.lineTo(px-14+sway,py-4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+6,py-8);ctx.lineTo(px+14+sway,py-4);ctx.stroke();
    // Body
    ctx.fillStyle=abl(c1,gc,0.3);ctx.strokeStyle=abl(c2,gc,0.3);ctx.lineWidth=0.9;
    ctx.beginPath();ctx.moveTo(px-6,py);ctx.lineTo(px+6,py);ctx.lineTo(px+4,py-14);ctx.lineTo(px-4,py-14);ctx.closePath();ctx.fill();ctx.stroke();
    // Head — slightly tilted
    ctx.fillStyle=abl('#6a5040',gc,0.3);
    ctx.beginPath();ctx.arc(px+sway*0.3,py-19,5.5,0,Math.PI*2);ctx.fill();ctx.stroke();
    // Eyes glow
    if(isNight){
      ctx.fillStyle='rgba(220,60,20,0.9)';
      ctx.beginPath();ctx.arc(px-2+sway*0.3,py-20,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(px+2+sway*0.3,py-20,1.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();

    // Screen edge indicator when close at night
    if(isNight&&dist<5){
      const screenP=iso(z.gx,z.gy);
      const ex=clamp(screenP.x,24,W-24),ey=clamp(screenP.y,24,H-24);
      if(screenP.x<0||screenP.x>W||screenP.y<0||screenP.y>H){
        ctx.save();ctx.globalAlpha=0.7+Math.sin(performance.now()*0.005)*0.3;
        ctx.fillStyle='rgba(220,40,10,0.8)';
        ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('☠',ex,ey);ctx.restore();
      }
    }
  });
}

function drawPlayer(gc,p){
  const{x:px,y:py}=iso(PL.gx,PL.gy);

  ctx.beginPath();ctx.moveTo(px+4,py);ctx.lineTo(px+5,py+10);ctx.stroke();
  ctx.fillStyle=abl('#4a5830',gc,0.25);ctx.strokeStyle=abl('#2a3010',gc,0.22);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px-7,py);ctx.lineTo(px+7,py);ctx.lineTo(px+5,py-14);ctx.lineTo(px-5,py-14);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=abl('#d4a878',gc,0.3);ctx.strokeStyle=abl('#8a5030',gc,0.25);ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(px,py-19,6,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Backpack
  ctx.fillStyle=abl('#6a4020',gc,0.3);ctx.strokeStyle=abl('#3a2010',gc,0.22);
  ctx.beginPath();ctx.moveTo(px+5,py-13);ctx.lineTo(px+11,py-12);ctx.lineTo(px+10,py-3);ctx.lineTo(px+5,py);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
  if(p.su<0.35){
    ctx.save();ctx.globalAlpha=(0.35-p.su)*2.2;
    const tg=ctx.createRadialGradient(px,py-10,2,px,py-10,48);
    tg.addColorStop(0,'rgba(255,160,40,0.32)');tg.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle=tg;ctx.beginPath();ctx.arc(px,py-10,48,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════════════════
function drawParts(p){
  if(weather==='rain'||weather==='storm'){
    ctx.save();ctx.strokeStyle='rgba(155,188,220,0.5)';ctx.lineWidth=1;
    const intens=Math.min(1,(1-p.su)*1.4+0.18);
    PARTS.forEach(pt=>{ctx.globalAlpha=pt.a*intens;ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(pt.x+0.28*pt.ln,pt.y+pt.ln);ctx.stroke();});
    ctx.restore();
  }
  if(weather==='fog'){
    PARTS.forEach(pt=>{ctx.save();ctx.globalAlpha=pt.a*1.4;ctx.fillStyle='rgba(172,182,196,0.28)';ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();ctx.restore();});
  }
}
function updateParts(){
  PARTS.forEach(pt=>{
    if(pt.tp==='r'){pt.y+=pt.sp*spd*0.35;pt.x+=0.12*pt.sp;if(pt.y>H){pt.y=-14;pt.x=Math.random()*W;}}
    if(pt.tp==='f'){pt.x+=pt.sp;if(pt.x>W+pt.r)pt.x=-pt.r;}
  });
}

// ═══════════════════════════════════════════════════════════════════
//  OVERLAYS
// ═══════════════════════════════════════════════════════════════════
function drawTiltShift(){
  const tg=ctx.createLinearGradient(0,0,0,H*0.19);
  tg.addColorStop(0,'rgba(0,0,0,0.56)');tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tg;ctx.fillRect(0,0,W,H*0.19);
  const bg=ctx.createLinearGradient(0,H,0,H*0.81);
  bg.addColorStop(0,'rgba(0,0,0,0.56)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,H*0.81,W,H*0.19);
}
function drawVignette(d){
  if(d<0.18) return;
  const v=ctx.createRadialGradient(W/2,H*0.44,H*0.09,W/2,H*0.44,W*0.82);
  v.addColorStop(0,'rgba(5,0,20,0)');v.addColorStop(0.58,'rgba(5,0,20,0)');
  v.addColorStop(1,`rgba(5,0,20,${Math.min(0.88,(d-0.18)*1.05)})`);
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
// Night chaos — red screen flash
let chaosFlash=0;
function drawChaos(d){
  if(d<0.7) return;
  chaosFlash=Math.max(0,chaosFlash-0.02);
  if(Math.random()<0.003*(d-0.7)*5) chaosFlash=Math.min(0.08,(d-0.7)*0.15);
  if(chaosFlash>0){
    ctx.save();ctx.globalAlpha=chaosFlash;ctx.fillStyle='rgba(180,0,0,1)';ctx.fillRect(0,0,W,H);ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════
//  DREAD
// ═══════════════════════════════════════════════════════════════════
function dread(t){
  if(t<0.25||t>0.92) return 0.92;
  if(t<0.30) return lerp(0.92,0.18,(t-0.25)/0.05);
  if(t<0.65) return lerp(0.18,0.04,(t-0.30)/0.35);
  if(t<0.73) return lerp(0.04,0.52,(t-0.65)/0.08);
  if(t<0.80) return lerp(0.52,0.92,(t-0.73)/0.07);
  return 0.92;
}
function dcol(d){
  if(d<0.15) return '#5ad05a';if(d<0.35) return '#c8c840';
  if(d<0.55) return '#e8a030';if(d<0.75) return '#e86020';return '#e82020';
}
function dlbl(d){
  return ['Safe','Uneasy','Tense','Danger','CRITICAL'][d<0.15?0:d<0.35?1:d<0.55?2:d<0.75?3:4];
}

// ═══════════════════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════════════════
function hudUpdate(p,dreadV,zombieNearDist){
  const hrs=gt*24,h=~~hrs%24,m=~~((hrs%1)*60);
  document.getElementById('clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const phases=['Night','Night','Night','Night','Night','Dawn','Dawn','Morning','Morning','Morning','Morning','Morning','Noon','Noon','Afternoon','Afternoon','Afternoon','Afternoon','Dusk','Dusk','Evening','Evening','Night','Night'];
  document.getElementById('phase-txt').textContent=phases[h]||'Night';
  document.getElementById('sea-icon').textContent=SICON[season];
  document.getElementById('wx-icon').textContent=WICON[weather];
  document.getElementById('dayn').textContent=day;
  const c=dcol(dreadV);
  const db=document.getElementById('dbar');
  db.style.width=(dreadV*100)+'%';db.style.background=`linear-gradient(to right,${dcol(dreadV*0.55)},${c})`;
  const dl=document.getElementById('dlbl');dl.textContent=dlbl(dreadV);dl.style.color=c;

  // Resources
  document.getElementById('r-wood').textContent=RES.wood;
  document.getElementById('r-food').textContent=RES.food;
  document.getElementById('r-metal').textContent=RES.metal;
  document.getElementById('r-med').textContent=RES.med;

  // Inventory slots
  for(let i=0;i<4;i++){
    const slot=document.getElementById(`inv-${i}`);
    const item=INV[i];
    slot.querySelector('.inv-icon').textContent=item?item.icon:'—';
    slot.querySelector('.inv-count').textContent=item?`×${item.qty}`:'';
    slot.classList.toggle('has-item',!!item);
  }

  // Warnings
  const wo=(gt>0.66&&gt<0.79)?Math.min(1,(gt-0.66)*9):0;
  document.getElementById('warn').style.opacity=wo;
  const isNight=gt>0.78||gt<0.28;
  document.getElementById('z-alert').style.opacity=(isNight&&zombieNearDist<3)?Math.min(1,(3-zombieNearDist)):0;
}

// ═══════════════════════════════════════════════════════════════════
//  SCAVENGING LOGIC
// ═══════════════════════════════════════════════════════════════════
let collectHoldTimer=0;
let lootPopupTimer=0;
let lootPopupY=0;

function checkNearLoot(){
  nearZone=null;
  let minDist=999;
  LOOT_ZONES.forEach(lz=>{
    if(lz.depleted) return;
    const d=gridDist(PL.gx,PL.gy,lz.gx,lz.gy);
    if(d<2.2&&d<minDist){minDist=d;nearZone=lz;}
  });
  // Check base deposit zone
  const baseDist=gridDist(PL.gx,PL.gy,0,0);
  const hint=document.getElementById('interact-hint');
  const cbw=document.getElementById('collect-bar-wrap');

  if(nearZone&&!collecting){
    hint.style.opacity='1';
    hint.textContent='Hold to Scavenge';
  } else if(baseDist<2&&INV.some(x=>x)){
    hint.style.opacity='1';
    hint.textContent='Tap to Deposit';
  } else {
    hint.style.opacity='0';
  }
}

function startCollect(){
  if(!nearZone||collecting) return;
  collecting=true;collectTarget=nearZone;collectProgress=0;
  document.getElementById('collect-bar-wrap').style.opacity='1';
}
function cancelCollect(){
  collecting=false;collectTarget=null;collectProgress=0;
  document.getElementById('collect-bar-wrap').style.opacity='0';
  document.getElementById('collect-bar').style.width='0%';
}

function tickCollect(dt){
  // Loot respawn
  LOOT_ZONES.forEach(lz=>{
    if(lz.depleted){lz.respawnTimer-=dt;if(lz.respawnTimer<=0)lz.depleted=false;}
  });

  if(!collecting||!collectTarget) return;
  collectProgress+=dt/collectTime;
  document.getElementById('collect-bar').style.width=Math.min(100,collectProgress*100)+'%';

  if(collectProgress>=1){
    // Collect!
    const lz=collectTarget;
    const qty=lz.qty[0]+~~(Math.random()*(lz.qty[1]-lz.qty[0]+1));
    // Add to first empty inventory slot
    let added=false;
    for(let i=0;i<4;i++){
      if(!INV[i]){INV[i]={type:lz.loot,icon:lz.icon,qty};added=true;break;}
      if(INV[i]&&INV[i].type===lz.loot){INV[i].qty+=qty;added=true;break;}
    }
    if(added){
      lz.depleted=true;lz.respawnTimer=60+Math.random()*60;
      showLootPopup(lz.icon,`${lz.loot} +${qty}`);
      playLootSound();
    }
    cancelCollect();
  }
}

function showLootPopup(icon,text){
  const pop=document.getElementById('loot-popup');
  document.getElementById('lp-icon').textContent=icon;
  document.getElementById('lp-txt').textContent=text;
  pop.style.top=`${H*0.38}px`;
  pop.style.opacity='1';
  lootPopupTimer=2.2;
}

function tickLootPopup(dt){
  if(lootPopupTimer>0){
    lootPopupTimer-=dt;
    const pop=document.getElementById('loot-popup');
    if(lootPopupTimer<=0.5) pop.style.opacity=Math.max(0,lootPopupTimer/0.5);
    else pop.style.opacity='1';
    // Float upward
    const baseTop=H*0.38;
    const elapsed=2.2-lootPopupTimer;
    pop.style.top=`${baseTop-elapsed*25}px`;
  }
}

function tryDeposit(){
  const baseDist=gridDist(PL.gx,PL.gy,0,0);
  if(baseDist>2.5) return;
  let deposited=false;
  INV.forEach((item,i)=>{
    if(item){RES[item.type]=(RES[item.type]||0)+item.qty;INV[i]=null;deposited=true;}
  });
  if(deposited){
    playLootSound();
    showLootPopup('🏠','Stored!');
    checkBaseUpgrade();
  }
}

function checkBaseUpgrade(){
  if(baseLevel===0&&RES.wood>=8){baseLevel=1;showLootPopup('🔧','Base Upgraded!');}
  else if(baseLevel===1&&RES.metal>=6&&RES.wood>=4){baseLevel=2;showLootPopup('⚙️','Steel Walls!');}
}

// ═══════════════════════════════════════════════════════════════════
//  ZOMBIE AI (watch + approach at night)
// ═══════════════════════════════════════════════════════════════════
function updateZombies(dt){
  const isNight=gt>0.78||gt<0.28;
  ZOMBIES.forEach(z=>{
    z.active=isNight;
    if(!isNight){
      // Drift back to start position
      z.gx=lerp(z.gx,z.startGx,dt*0.5);
      z.gy=lerp(z.gy,z.startGy,dt*0.5);
      return;
    }
    const dist=gridDist(PL.gx,PL.gy,z.gx,z.gy);
    if(dist<5){
      // Chase
      const dx=PL.gx-z.gx,dy=PL.gy-z.gy;
      const len=Math.hypot(dx,dy)||1;
      z.gx+=dx/len*z.speed*spd*dt*2.5;
      z.gy+=dy/len*z.speed*spd*dt*2.5;
      z.alert=true;
    } else {
      // Wander
      if(!z.wanderT||z.wanderT<=0){
        z.wanderDx=(Math.random()-0.5)*0.8;
        z.wanderDy=(Math.random()-0.5)*0.8;
        z.wanderT=2+Math.random()*3;
      }
      z.wanderT-=dt;
      z.gx=clamp(z.gx+z.wanderDx*z.speed*spd*dt,-GS+1,GS-1);
      z.gy=clamp(z.gy+z.wanderDy*z.speed*spd*dt,-GS+1,GS-1);
      z.alert=false;
    }
  });
}

function closestZombieDist(){
  let minD=999;
  ZOMBIES.forEach(z=>{if(z.active)minD=Math.min(minD,gridDist(PL.gx,PL.gy,z.gx,z.gy));});
  return minD;
}

// ═══════════════════════════════════════════════════════════════════
//  FLOATING JOYSTICK
// ═══════════════════════════════════════════════════════════════════
const JOY={active:false,startX:0,startY:0,dx:0,dy:0,id:null,maxR:46};
const jOuter=document.getElementById('joy-outer');
const jInner=document.getElementById('joy-inner');
const jZone=document.getElementById('joy-zone');

jZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(JOY.active) return;
  const t=e.changedTouches[0];
  JOY.active=true;JOY.id=t.identifier;
  JOY.startX=t.clientX;JOY.startY=t.clientY;
  JOY.dx=0;JOY.dy=0;
  jOuter.style.display='block';
  jOuter.style.left=t.clientX+'px';jOuter.style.top=t.clientY+'px';
  jInner.style.display='block';
  jInner.style.left=t.clientX+'px';jInner.style.top=t.clientY+'px';
},{passive:false});

jZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==JOY.id) continue;
    const dx=t.clientX-JOY.startX,dy=t.clientY-JOY.startY;
    const dist=Math.hypot(dx,dy);
    const clamped=Math.min(dist,JOY.maxR);
    const angle=Math.atan2(dy,dx);
    JOY.dx=Math.cos(angle)*clamped/JOY.maxR;
    JOY.dy=Math.sin(angle)*clamped/JOY.maxR;
    jInner.style.left=(JOY.startX+Math.cos(angle)*clamped)+'px';
    jInner.style.top=(JOY.startY+Math.sin(angle)*clamped)+'px';
  }
},{passive:false});

function releaseJoy(){
  JOY.active=false;JOY.dx=0;JOY.dy=0;
  jOuter.style.display='none';jInner.style.display='none';
}
jZone.addEventListener('touchend',e=>{e.preventDefault();releaseJoy();},{passive:false});
jZone.addEventListener('touchcancel',()=>releaseJoy());

// Tap right side to deposit / interact
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  if(t.clientX>W*0.55){
    // Right half — collect hold or deposit
    const baseDist=gridDist(PL.gx,PL.gy,0,0);
    if(baseDist<2.5&&INV.some(x=>x)){tryDeposit();}
    else if(nearZone){startCollect();}
  }
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  cancelCollect();
},{passive:false});

// Desktop fallback (WASD)
const KB={};
window.addEventListener('keydown',e=>KB[e.key]=true);
window.addEventListener('keyup',e=>KB[e.key]=false);
// Spacebar = collect/deposit
window.addEventListener('keydown',e=>{
  if(e.key===' '){
    const baseDist=gridDist(PL.gx,PL.gy,0,0);
    if(baseDist<2.5&&INV.some(x=>x)) tryDeposit();
    else if(nearZone) startCollect();
  }
});
window.addEventListener('keyup',e=>{if(e.key===' ') cancelCollect();});

function movePL(dt){
  let mx=0,my=0;
  // Joystick
  if(JOY.active){mx=JOY.dx;my=JOY.dy;}
  // Keyboard fallback — WASD maps to iso directions
  if(KB['w']||KB['ArrowUp']){mx-=0.7;my-=0.7;}
  if(KB['s']||KB['ArrowDown']){mx+=0.7;my+=0.7;}
  if(KB['a']||KB['ArrowLeft']){mx-=0.7;my+=0.7;}
  if(KB['d']||KB['ArrowRight']){mx+=0.7;my-=0.7;}
  const baseSpd=0.055*spd*dt;
  PL.gx=clamp(PL.gx+mx*baseSpd,-GS+1,GS-1);
  PL.gy=clamp(PL.gy+my*baseSpd,-GS+1,GS-1);
  // Cancel collect if moved away
  if(collecting&&collectTarget&&gridDist(PL.gx,PL.gy,collectTarget.gx,collectTarget.gy)>2.5) cancelCollect();
}

// ═══════════════════════════════════════════════════════════════════
//  SPEED BUTTONS
// ═══════════════════════════════════════════════════════════════════
document.querySelectorAll('.sb').forEach(b=>{
  b.addEventListener('touchstart',e=>{e.preventDefault();spd=parseInt(b.dataset.s);document.querySelectorAll('.sb').forEach(x=>x.classList.remove('active'));b.classList.add('active');},{passive:false});
  b.addEventListener('click',()=>{spd=parseInt(b.dataset.s);document.querySelectorAll('.sb').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
});

// ═══════════════════════════════════════════════════════════════════
//  WEATHER
// ═══════════════════════════════════════════════════════════════════
function tickWx(dt){
  wxT-=dt;
  if(wxT<=0){weather=WX[~~(Math.random()*WX.length)];wxT=55+Math.random()*90;spawnParts();}
}

// ═══════════════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════════
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05);last=ts;
  if(running){
    const adv=(spd*dt)/REAL_DAY_S;
    const newGt=(gt+adv)%1;
    if(newGt<gt){day++;season=Math.floor(day/7)%4;}
    gt=newGt;

    tickWx(dt*spd);
    updateParts();
    movePL(dt);
    updateZombies(dt);
    tickCollect(dt);
    tickLootPopup(dt);
    checkNearLoot();

    const p=getP(gt);
    const gc=h2r(p.am);
    const dreadV=dread(gt);
    const now=performance.now()*0.001;
    const zDist=closestZombieDist();

    drawSky(p);
    drawGround(gc,p);
    drawLootZones(p,now);
    drawStructs(gc,p);
    drawTrees(gc);
    drawZombies(gc,p);
    drawPlayer(gc,p);
    drawParts(p);
    drawVignette(dreadV);
    drawChaos(dreadV);
    drawTiltShift();

    hudUpdate(p,dreadV,zDist);
    updateAudio(dt,dreadV,zDist<4?zDist:null);
  }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════
function startGame(){
  const intro=document.getElementById('intro');
  intro.classList.add('gone');
  setTimeout(()=>{try{intro.remove();}catch(e){}},1300);
  initAudio();running=true;spawnParts();wxT=80;
}
document.getElementById('sbtn').addEventListener('touchstart',e=>{e.preventDefault();startGame();},{passive:false});
document.getElementById('sbtn').addEventListener('click',startGame);
requestAnimationFrame(loop);
</script>
