<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#040310">
<title>Last Light</title>
<link rel="manifest" href="manifest.json">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;}
  #gc{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  /* HUD */
  #hud{
    position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;
    height:54px;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;
    background:linear-gradient(to bottom,rgba(4,3,16,0.90) 55%,transparent);
    z-index:20;pointer-events:none;
  }
  .hc{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .hl{font:700 8px/1 'Courier New',monospace;letter-spacing:2px;color:rgba(210,170,60,0.5);text-transform:uppercase;}
  .hv{font:700 16px/1 'Courier New',monospace;color:#e8c85a;letter-spacing:1px;}
  #clock{font-size:23px;}
  #phase-txt{font:700 8px/1 'Courier New',monospace;letter-spacing:2px;color:rgba(210,170,60,0.5);text-transform:uppercase;margin-top:1px;}
  #dread-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  #dbar-bg{width:82px;height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;}
  #dbar{height:100%;width:0%;border-radius:3px;transition:width 1.5s ease;}

  /* Night warning */
  #warn{
    position:absolute;bottom:30%;left:50%;transform:translateX(-50%);
    z-index:25;font:700 10px/1 'Courier New',monospace;letter-spacing:4px;
    color:rgba(232,80,30,0.95);text-transform:uppercase;
    text-shadow:0 0 14px rgba(232,64,0,0.9);
    opacity:0;transition:opacity 2s ease;white-space:nowrap;pointer-events:none;
    animation:pw 2.2s ease-in-out infinite;
  }
  @keyframes pw{0%,100%{filter:brightness(0.7)}50%{filter:brightness(1.4)}}

  /* D-PAD */
  #dpad{
    position:absolute;
    bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    right:18px;width:138px;height:138px;z-index:30;
  }
  .db{
    position:absolute;width:46px;height:46px;
    background:rgba(8,5,0,0.72);border:1.5px solid rgba(210,170,60,0.32);
    border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:20px;color:rgba(210,170,60,0.78);cursor:pointer;
  }
  .db.pressed{background:rgba(50,28,0,0.92);border-color:rgba(210,170,60,0.85);}
  #dp-nw{top:0;left:0;}
  #dp-ne{top:0;right:0;}
  #dp-sw{bottom:0;left:0;}
  #dp-se{bottom:0;right:0;}
  #dp-c{top:46px;left:46px;width:46px;height:46px;font-size:11px;color:rgba(210,170,60,0.3);}

  /* Speed */
  #spd-row{
    position:absolute;bottom:calc(env(safe-area-inset-bottom,0px)+20px);
    left:14px;z-index:30;display:flex;flex-direction:column;gap:5px;
  }
  .sb{
    background:rgba(8,5,0,0.72);border:1.5px solid rgba(210,170,60,0.22);
    border-radius:5px;padding:6px 11px;
    font:700 10px/1 'Courier New',monospace;letter-spacing:1px;
    color:rgba(210,170,60,0.5);cursor:pointer;
  }
  .sb.active{border-color:rgba(210,170,60,0.82);color:#e8c85a;background:rgba(42,22,0,0.88);}

  /* Intro */
  #intro{
    position:absolute;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(4,3,16,0.93);transition:opacity 1.2s ease;
  }
  #intro.gone{opacity:0;pointer-events:none;}
  .it{font:900 clamp(38px,11vw,62px)/1 'Courier New',monospace;letter-spacing:6px;color:#e8c85a;text-transform:uppercase;text-shadow:0 0 40px rgba(232,200,90,0.32);margin-bottom:5px;}
  .is{font:400 10px/1 'Courier New',monospace;letter-spacing:6px;color:rgba(210,170,60,0.38);text-transform:uppercase;margin-bottom:38px;}
  .ib{background:transparent;border:1px solid rgba(210,170,60,0.5);color:#e8c85a;font:700 11px/1 'Courier New',monospace;letter-spacing:4px;text-transform:uppercase;padding:14px 34px;border-radius:4px;cursor:pointer;}
  .ib:active{background:rgba(210,170,60,0.07);}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="hc">
      <div class="hl">Time</div>
      <div class="hv" id="clock">06:00</div>
      <div id="phase-txt">Dawn</div>
    </div>
    <div class="hc">
      <div class="hv" id="sea-icon">🌱</div>
      <div class="hv" id="wx-icon">☀️</div>
    </div>
    <div id="dread-wrap">
      <div class="hl" id="dlbl" style="color:#5ad05a">Safe</div>
      <div id="dbar-bg"><div id="dbar"></div></div>
      <div class="hl">Day <span id="dayn">1</span></div>
    </div>
  </div>

  <div id="warn">⚠ Night Approaches ⚠</div>

  <div id="dpad">
    <div class="db" id="dp-nw">↖</div>
    <div class="db" id="dp-ne">↗</div>
    <div class="db" id="dp-sw">↙</div>
    <div class="db" id="dp-se">↘</div>
    <div class="db" id="dp-c">●</div>
  </div>

  <div id="spd-row">
    <div class="sb" data-s="1">1×</div>
    <div class="sb active" data-s="6">6×</div>
    <div class="sb" data-s="30">30×</div>
  </div>

  <div id="intro">
    <div class="it">Last Light</div>
    <div class="is">Survive the Dark</div>
    <button class="ib" id="sbtn">Begin</button>
  </div>
</div>

<script>
// ── Canvas ────────────────────────────────────────────────────────────────────
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
let W,H;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();

// ── State ─────────────────────────────────────────────────────────────────────
const REAL_DAY_S=12;
let spd=6,running=false;
let gt=0.25,day=1,season=0;
let weather='clear',wxT=90;
const WX=['clear','clear','clear','cloudy','rain','fog','storm'];
const WICON={clear:'☀️',cloudy:'⛅',rain:'🌧️',fog:'🌫️',storm:'⛈️'};
const SICON=['🌱','☀️','🍂','❄️'];

// ── Player ────────────────────────────────────────────────────────────────────
const PL={gx:0.5,gy:0.5};
const K={nw:false,ne:false,sw:false,se:false};

// ── Iso ───────────────────────────────────────────────────────────────────────
const TW=78,TH=39;
function ox(){return W*0.5;}
function oy(){return H*0.46;}
function iso(gx,gy){return{x:ox()+(gx-gy)*(TW/2),y:oy()+(gx+gy)*(TH/2)};}

// ── Utils ─────────────────────────────────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t;}
function sr(s){const x=Math.sin(s+1)*10000;return x-Math.floor(x);}
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lhex(a,b,t){
  const[r1,g1,b1]=h2r(a),[r2,g2,b2]=h2r(b);
  return`rgb(${~~lerp(r1,r2,t)},${~~lerp(g1,g2,t)},${~~lerp(b1,b2,t)})`;
}
function ab(hex,gc,a=0.4){
  const[r,g,b]=h2r(hex);
  return`rgb(${~~(r*(1-a)+gc[0]*a)},${~~(g*(1-a)+gc[1]*a)},${~~(b*(1-a)+gc[2]*a)})`;
}

// ── Palette ───────────────────────────────────────────────────────────────────
const PAL=[
  {t:0.00,sT:'#040310',sB:'#0a0520',am:'#1a1235',su:0.00},
  {t:0.10,sT:'#0a0520',sB:'#1a0a30',am:'#251845',su:0.05},
  {t:0.22,sT:'#0d0828',sB:'#2a1545',am:'#2d1e55',su:0.08},
  {t:0.25,sT:'#2a0d35',sB:'#5a2060',am:'#4d3a7a',su:0.14},
  {t:0.28,sT:'#7b2a10',sB:'#c05028',am:'#8a6030',su:0.32},
  {t:0.33,sT:'#d46020',sB:'#f0a040',am:'#c09050',su:0.62},
  {t:0.40,sT:'#5ab0e8',sB:'#c0e0f8',am:'#e8d890',su:0.90},
  {t:0.50,sT:'#2a80d8',sB:'#80c8f0',am:'#f8f0d8',su:1.00},
  {t:0.62,sT:'#3898dc',sB:'#90d0f0',am:'#f0e0c0',su:0.94},
  {t:0.70,sT:'#d46020',sB:'#f09040',am:'#e0b060',su:0.68},
  {t:0.75,sT:'#7b2a10',sB:'#b04028',am:'#904830',su:0.38},
  {t:0.79,sT:'#280820',sB:'#4a1535',am:'#35153a',su:0.12},
  {t:0.85,sT:'#0d0520',sB:'#1a0828',am:'#1a1030',su:0.04},
  {t:1.00,sT:'#040310',sB:'#0a0520',am:'#1a1235',su:0.00},
];
function getP(t){
  for(let i=0;i<PAL.length-1;i++){
    if(t>=PAL[i].t&&t<=PAL[i+1].t){
      const f=(t-PAL[i].t)/(PAL[i+1].t-PAL[i].t);
      return{sT:lhex(PAL[i].sT,PAL[i+1].sT,f),sB:lhex(PAL[i].sB,PAL[i+1].sB,f),
             am:lhex(PAL[i].am,PAL[i+1].am,f),su:lerp(PAL[i].su,PAL[i+1].su,f)};
    }
  }
  return PAL[0];
}

// ── Season ────────────────────────────────────────────────────────────────────
const SG=[
  {b:'#6a8c4a',a:'#4a7c2a',r:'#8a7860'},
  {b:'#5a8040',a:'#3a6c1a',r:'#9a8870'},
  {b:'#8a6430',a:'#c08028',r:'#8a7060'},
  {b:'#b8c8d0',a:'#a0b8c8',r:'#888898'},
];
const FOL=[
  ['#3a6c1a','#4a8c2a','#2a5c0a'],
  ['#2a6010','#388020','#1a5008'],
  ['#b86810','#d08020','#8a4808'],
  ['#c8d0d8','#a0b0b8','#8098a8'],
];

// ── World ─────────────────────────────────────────────────────────────────────
const GS=10;
const TILES=[],STRUCTS=[],TREES=[],PARTS=[];

function buildWorld(){
  for(let y=-GS;y<=GS;y++) for(let x=-GS;x<=GS;x++){
    let t=0;
    if(x===0||y===0) t=1;
    if(x>=4&&x<=6&&y>=3&&y<=6) t=3;
    if((x===-3&&y===-3)||(x===5&&y===-2)) t=2;
    TILES.push({x,y,t});
  }
  STRUCTS.push({gx:0,gy:0,tp:'shack'});
  STRUCTS.push({gx:-3,gy:2,tp:'ruin'});
  STRUCTS.push({gx:-5,gy:-1,tp:'tower'});
  STRUCTS.push({gx:2,gy:-2,tp:'fence'});
  [[-4,-3],[-3,-5],[1,-4],[6,-3],[7,-1],[-7,2],[-6,-4],[4,5],[-1,6],
   [-8,-2],[2,7],[6,6],[-5,5],[9,-4],[0,-7],[5,-6],[-2,-8]].forEach(([tx,ty])=>{
    TREES.push({gx:tx,gy:ty,v:~~(sr(tx*7+ty)*3),h:0.85+sr(tx*13+ty)*0.5,l:(sr(tx*3+ty)-0.5)*0.1});
  });
}
buildWorld();

function spawnParts(){
  PARTS.length=0;
  if(weather==='rain'||weather==='storm')
    for(let i=0;i<110;i++) PARTS.push({x:Math.random()*W,y:Math.random()*H,sp:5+Math.random()*5,ln:8+Math.random()*9,a:0.22+Math.random()*0.35,tp:'r'});
  if(weather==='fog')
    for(let i=0;i<12;i++) PARTS.push({x:Math.random()*W,y:H*0.28+Math.random()*H*0.52,r:90+Math.random()*190,sp:0.15+Math.random()*0.22,a:0.04+Math.random()*0.05,tp:'f'});
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function diamond(px,py,w,h,fill,stroke,lw=0.75){
  ctx.beginPath();
  ctx.moveTo(px,py-h/2);ctx.lineTo(px+w/2,py);ctx.lineTo(px,py+h/2);ctx.lineTo(px-w/2,py);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();
}
function box(px,py,bw,bh,d,cT,cF,cS,cStr){
  ctx.strokeStyle=cStr;ctx.lineWidth=1.05;
  ctx.fillStyle=cT;ctx.beginPath();
  ctx.moveTo(px,py-d);ctx.lineTo(px+bw/2,py-d+bh/2);ctx.lineTo(px,py-d+bh);ctx.lineTo(px-bw/2,py-d+bh/2);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=cF;ctx.beginPath();
  ctx.moveTo(px-bw/2,py-d+bh/2);ctx.lineTo(px,py-d+bh);ctx.lineTo(px,py);ctx.lineTo(px-bw/2,py-d+bh/2+d);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=cS;ctx.beginPath();
  ctx.moveTo(px,py-d+bh);ctx.lineTo(px+bw/2,py-d+bh/2);ctx.lineTo(px+bw/2,py-d+bh/2+d);ctx.lineTo(px,py);
  ctx.closePath();ctx.fill();ctx.stroke();
}

// ── Sky ───────────────────────────────────────────────────────────────────────
function drawSky(p){
  const g=ctx.createLinearGradient(0,0,0,H*0.62);
  g.addColorStop(0,p.sT);g.addColorStop(1,p.sB);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const night=Math.max(0,1-p.su*3.5);
  if(night>0.08){
    ctx.save();ctx.globalAlpha=night*0.82;
    for(let i=0;i<80;i++){
      ctx.beginPath();ctx.arc(sr(i*7)*W,sr(i*13)*H*0.52,sr(i*3)*1.3+0.2,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,240,${0.4+sr(i)*0.6})`;ctx.fill();
    }
    ctx.restore();
  }
  if(night>0.12){
    const mx=W*0.76,my=H*0.10,mr=17;
    ctx.save();ctx.globalAlpha=night*0.88;
    const mg=ctx.createRadialGradient(mx,my,mr,mx,my,mr*4.5);
    mg.addColorStop(0,'rgba(220,210,180,0.13)');mg.addColorStop(1,'rgba(220,210,180,0)');
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mr*4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e8e0c8';ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  if(p.su>0.04){
    const sf=Math.min(1,Math.max(0,(gt-0.25)/0.5));
    const sx=W*(0.12+sf*0.76),sy=H*(0.37-Math.sin(sf*Math.PI)*0.25);
    ctx.save();ctx.globalAlpha=Math.min(1,p.su*1.12);
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,TW*2.4);
    sg.addColorStop(0,'rgba(255,252,200,1)');sg.addColorStop(0.12,'rgba(255,220,120,0.52)');
    sg.addColorStop(0.45,'rgba(255,160,40,0.09)');sg.addColorStop(1,'rgba(255,120,0,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,TW*2.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,220,0.93)';ctx.beginPath();ctx.arc(sx,sy,13,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ── Ground ────────────────────────────────────────────────────────────────────
function drawGround(gc,p){
  const sorted=[...TILES].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  const sg=SG[season];
  const now=performance.now()*0.001;
  sorted.forEach(tl=>{
    const{x:px,y:py}=iso(tl.x,tl.y);
    if(px<-TW||px>W+TW||py<-TH||py>H+TH) return;
    let fill,stroke;
    switch(tl.t){
      case 0:fill=ab(sg.b,gc,0.42);stroke=ab(sg.a,gc,0.32);break;
      case 1:fill=ab(sg.r,gc,0.42);stroke=ab('#6a5840',gc,0.32);break;
      case 2:fill=ab('#7a6858',gc,0.42);stroke=ab('#5a4838',gc,0.32);break;
      case 3:{
        const wb=p.su>0.35?'#3a7ab8':p.su>0.1?'#1a3a68':'#0a1838';
        fill=ab(wb,gc,0.22);stroke=ab('#2a5a98',gc,0.22);}break;
      default:fill=sg.b;stroke=sg.a;
    }
    diamond(px,py,TW,TH,fill,stroke,0.65);
    if(season===3){ctx.save();ctx.globalAlpha=0.46;diamond(px,py,TW,TH,'rgba(224,232,244,0.62)','transparent');ctx.restore();}
    if(tl.t===3&&p.su>0.22){
      ctx.save();ctx.globalAlpha=0.13*p.su;ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=0.65;
      ctx.beginPath();ctx.moveTo(px-9+Math.sin(now+tl.x)*3,py-1);ctx.lineTo(px+9+Math.sin(now+tl.x*0.7)*2,py-1);ctx.stroke();ctx.restore();
    }
  });
}

// ── Structures ────────────────────────────────────────────────────────────────
function drawStructs(gc,p){
  STRUCTS.forEach(s=>{
    const{x:px,y:py}=iso(s.gx,s.gy);
    if(s.tp==='shack'){
      box(px,py,TW*1.9,TH*1.9,TH*2.8,
        ab('#c8b090',gc,0.32),ab('#5a4030',gc,0.32),ab('#7a5840',gc,0.32),ab('#3a2818',gc,0.22));
      ctx.save();
      ctx.fillStyle=ab('#4a2810',gc,0.38);ctx.strokeStyle=ab('#2a1808',gc,0.22);ctx.lineWidth=1.4;
      const ry=py-TH*2.8-TH;
      ctx.beginPath();ctx.moveTo(px-TW*0.95,ry+TH);ctx.lineTo(px,ry);ctx.lineTo(px+TW*0.95,ry+TH);ctx.lineTo(px,ry+TH*1.9);ctx.closePath();
      ctx.fill();ctx.stroke();ctx.restore();
      if(p.su<0.4){
        ctx.save();ctx.globalAlpha=(0.4-p.su)*2.1;
        ctx.fillStyle='rgba(255,200,80,0.75)';ctx.fillRect(px-TW*0.4,py-TH*1.7,TW*0.28,TH*0.56);
        const wg=ctx.createRadialGradient(px-TW*0.26,py-TH*1.42,2,px-TW*0.26,py-TH*1.42,TW*0.65);
        wg.addColorStop(0,'rgba(255,180,40,0.22)');wg.addColorStop(1,'rgba(255,180,40,0)');
        ctx.fillStyle=wg;ctx.fillRect(px-TW*1.1,py-TH*2.9,TW*2.2,TH*2.2);ctx.restore();
      }
    }
    else if(s.tp==='ruin'){
      box(px,py,TW*1.7,TH*1.1,TH*1.6,
        ab('#888070',gc,0.32),ab('#504840',gc,0.32),ab('#686060',gc,0.32),ab('#302820',gc,0.22));
      ctx.save();ctx.fillStyle=ab('#706050',gc,0.32);ctx.strokeStyle=ab('#403828',gc,0.22);ctx.lineWidth=0.65;
      for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(px+(sr(i*7)-0.5)*TW,py+sr(i*13)*TH*0.62,3+sr(i*3)*5,0,Math.PI*2);ctx.fill();ctx.stroke();}
      ctx.restore();
    }
    else if(s.tp==='tower'){
      box(px,py,TW*0.95,TH*0.95,TH*5,
        ab('#a09080',gc,0.32),ab('#484040',gc,0.32),ab('#606058',gc,0.32),ab('#282020',gc,0.22));
      if(p.su<0.3){
        const t=performance.now()*0.003,fl=0.55+Math.sin(t)*0.45;
        ctx.save();ctx.globalAlpha=(0.3-p.su)*2.2*fl;
        const lg=ctx.createRadialGradient(px,py-TH*5,2,px,py-TH*5,52);
        lg.addColorStop(0,'rgba(255,60,0,0.9)');lg.addColorStop(1,'rgba(255,0,0,0)');
        ctx.fillStyle=lg;ctx.beginPath();ctx.arc(px,py-TH*5,52,0,Math.PI*2);ctx.fill();ctx.restore();
      }
    }
    else if(s.tp==='fence'){
      for(let i=-3;i<=3;i++){
        const fp=iso(s.gx+i*0.5,s.gy);
        ctx.save();ctx.strokeStyle=ab('#6a4a28',gc,0.32);ctx.lineWidth=2.5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(fp.x,fp.y);ctx.lineTo(fp.x,fp.y-TH*1.5);ctx.stroke();ctx.restore();
      }
    }
  });
}

// ── Trees ─────────────────────────────────────────────────────────────────────
function drawTrees(gc){
  const fc=FOL[season];
  [...TREES].sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy)).forEach(tr=>{
    const{x:px,y:py}=iso(tr.gx,tr.gy);
    const tH=TH*tr.h*4.2,trH=tH*0.28;
    ctx.save();ctx.strokeStyle=ab('#5a3a18',gc,0.38);ctx.lineWidth=2.5+tr.h;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+tr.l*tH*20,py-trH);ctx.stroke();ctx.restore();
    const layers=tr.v===0?3:tr.v===1?2:4;
    for(let l=0;l<layers;l++){
      const ly=py-trH-(tH-trH)*(l/layers)*0.88;
      const lr=(TW*0.38*tr.h)*(1-l/layers*0.28);
      ctx.save();ctx.globalAlpha=0.88;
      for(let k=0;k<3;k++){
        ctx.fillStyle=ab(fc[l%fc.length],gc,0.45);ctx.strokeStyle=ab('#2a3a10',gc,0.3);ctx.lineWidth=0.65;
        ctx.beginPath();
        ctx.arc(px+(sr(tr.gx*7+l*3+k)*2-1)*lr*0.38+tr.l*tH*20*(1-l/layers),
                ly+(sr(tr.gy*11+l*5+k)*2-1)*lr*0.28,
                lr*(0.72+sr(k*17)*0.38),0,Math.PI*2);
        ctx.fill();ctx.stroke();
      }
      ctx.restore();
    }
  });
}

// ── Player ────────────────────────────────────────────────────────────────────
function drawPlayer(gc,p){
  const{x:px,y:py}=iso(PL.gx,PL.gy);
  ctx.save();ctx.globalAlpha=0.22*p.su+0.1;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(px,py+2,12,4,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.save();
  ctx.strokeStyle=ab('#2a1808',gc,0.2);ctx.lineWidth=3.8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px-4,py);ctx.lineTo(px-5,py+10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(px+4,py);ctx.lineTo(px+5,py+10);ctx.stroke();
  ctx.fillStyle=ab('#4a5830',gc,0.25);ctx.strokeStyle=ab('#2a3010',gc,0.22);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px-7,py);ctx.lineTo(px+7,py);ctx.lineTo(px+5,py-14);ctx.lineTo(px-5,py-14);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=ab('#d4a878',gc,0.3);ctx.strokeStyle=ab('#8a5030',gc,0.25);ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(px,py-19,6,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=ab('#6a4020',gc,0.3);ctx.strokeStyle=ab('#3a2010',gc,0.22);
  ctx.beginPath();ctx.moveTo(px+5,py-13);ctx.lineTo(px+11,py-12);ctx.lineTo(px+10,py-3);ctx.lineTo(px+5,py);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
  if(p.su<0.35){
    ctx.save();ctx.globalAlpha=(0.35-p.su)*2.2;
    const tg=ctx.createRadialGradient(px,py-10,2,px,py-10,48);
    tg.addColorStop(0,'rgba(255,160,40,0.32)');tg.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle=tg;ctx.beginPath();ctx.arc(px,py-10,48,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

// ── Particles ─────────────────────────────────────────────────────────────────
function drawParts(p){
  if(weather==='rain'||weather==='storm'){
    ctx.save();ctx.strokeStyle='rgba(155,188,220,0.5)';ctx.lineWidth=1;
    const intens=Math.min(1,(1-p.su)*1.4+0.18);
    PARTS.forEach(pt=>{ctx.globalAlpha=pt.a*intens;ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(pt.x+0.28*pt.ln,pt.y+pt.ln);ctx.stroke();});
    ctx.restore();
  }
  if(weather==='fog'){
    PARTS.forEach(pt=>{ctx.save();ctx.globalAlpha=pt.a*1.4;ctx.fillStyle='rgba(172,182,196,0.28)';ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();ctx.restore();});
  }
}
function updateParts(){
  PARTS.forEach(pt=>{
    if(pt.tp==='r'){pt.y+=pt.sp*spd*0.38;pt.x+=0.12*pt.sp;if(pt.y>H){pt.y=-14;pt.x=Math.random()*W;}}
    if(pt.tp==='f'){pt.x+=pt.sp;if(pt.x>W+pt.r)pt.x=-pt.r;}
  });
}

// ── Overlay effects ────────────────────────────────────────────────────────────
function drawTiltShift(){
  const tg=ctx.createLinearGradient(0,0,0,H*0.19);
  tg.addColorStop(0,'rgba(0,0,0,0.58)');tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tg;ctx.fillRect(0,0,W,H*0.19);
  const bg=ctx.createLinearGradient(0,H,0,H*0.81);
  bg.addColorStop(0,'rgba(0,0,0,0.58)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,H*0.81,W,H*0.19);
}
function drawVignette(d){
  if(d<0.18) return;
  const v=ctx.createRadialGradient(W/2,H*0.44,H*0.09,W/2,H*0.44,W*0.82);
  v.addColorStop(0,'rgba(5,0,20,0)');v.addColorStop(0.58,'rgba(5,0,20,0)');
  v.addColorStop(1,`rgba(5,0,20,${Math.min(0.88,(d-0.18)*1.08)})`);
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

// ── Dread ─────────────────────────────────────────────────────────────────────
function dread(t){
  if(t<0.25||t>0.92) return 0.9;
  if(t<0.30) return lerp(0.9,0.18,(t-0.25)/0.05);
  if(t<0.65) return lerp(0.18,0.04,(t-0.30)/0.35);
  if(t<0.73) return lerp(0.04,0.52,(t-0.65)/0.08);
  if(t<0.80) return lerp(0.52,0.90,(t-0.73)/0.07);
  return 0.9;
}
function dcol(d){
  if(d<0.15) return '#5ad05a';
  if(d<0.35) return '#c8c840';
  if(d<0.55) return '#e8a030';
  if(d<0.75) return '#e86020';
  return '#e82020';
}
function dlbl(d){
  const L=['Safe','Uneasy','Tense','Danger','CRITICAL'];
  return L[d<0.15?0:d<0.35?1:d<0.55?2:d<0.75?3:4];
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function hudUpdate(p){
  const hrs=gt*24,h=~~hrs%24,m=~~((hrs%1)*60);
  document.getElementById('clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const phases=['Night','Night','Night','Night','Night','Dawn','Dawn','Morning','Morning','Morning','Morning','Morning','Noon','Noon','Afternoon','Afternoon','Afternoon','Afternoon','Dusk','Dusk','Evening','Evening','Night','Night'];
  document.getElementById('phase-txt').textContent=phases[h]||'Night';
  document.getElementById('sea-icon').textContent=SICON[season];
  document.getElementById('wx-icon').textContent=WICON[weather];
  document.getElementById('dayn').textContent=day;
  const d=dread(gt),c=dcol(d);
  const db=document.getElementById('dbar');
  db.style.width=(d*100)+'%';
  db.style.background=`linear-gradient(to right,${dcol(d*0.55)},${c})`;
  db.style.boxShadow=`0 0 5px ${c}88`;
  const dl=document.getElementById('dlbl');
  dl.textContent=dlbl(d);dl.style.color=c;
  const wo=(gt>0.66&&gt<0.79)?Math.min(1,(gt-0.66)*9):0;
  document.getElementById('warn').style.opacity=wo;
}

// ── Weather ───────────────────────────────────────────────────────────────────
function tickWx(dt){
  wxT-=dt;
  if(wxT<=0){weather=WX[~~(Math.random()*WX.length)];wxT=55+Math.random()*100;spawnParts();}
}

// ── Movement ──────────────────────────────────────────────────────────────────
function movePL(dt){
  const s=0.04*spd*dt*3.8;
  if(K.nw){PL.gx-=s;PL.gy-=s*0.28;}
  if(K.ne){PL.gx+=s;PL.gy-=s*0.28;}
  if(K.sw){PL.gx-=s;PL.gy+=s*0.28;}
  if(K.se){PL.gx+=s;PL.gy+=s*0.28;}
  PL.gx=Math.max(-GS+1,Math.min(GS-1,PL.gx));
  PL.gy=Math.max(-GS+1,Math.min(GS-1,PL.gy));
}

// ── D-pad setup ───────────────────────────────────────────────────────────────
function setupDpad(){
  [['dp-nw','nw'],['dp-ne','ne'],['dp-sw','sw'],['dp-se','se']].forEach(([id,dir])=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault();K[dir]=true;el.classList.add('pressed');},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();K[dir]=false;el.classList.remove('pressed');},{passive:false});
    el.addEventListener('touchcancel',()=>{K[dir]=false;el.classList.remove('pressed');});
  });
}

// ── Speed setup ───────────────────────────────────────────────────────────────
function setupSpd(){
  document.querySelectorAll('.sb').forEach(b=>{
    b.addEventListener('touchstart',e=>{
      e.preventDefault();spd=parseInt(b.dataset.s);
      document.querySelectorAll('.sb').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    },{passive:false});
    b.addEventListener('click',()=>{
      spd=parseInt(b.dataset.s);
      document.querySelectorAll('.sb').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
  });
}

// ── Audio ─────────────────────────────────────────────────────────────────────
let aCtx=null,dNode=null,dGain=null;
function initAudio(){
  try{
    aCtx=new(window.AudioContext||window.webkitAudioContext)();
    dNode=aCtx.createOscillator();dNode.type='sawtooth';dNode.frequency.value=50;
    dGain=aCtx.createGain();dGain.gain.value=0;
    const lpf=aCtx.createBiquadFilter();lpf.type='lowpass';lpf.frequency.value=175;
    dNode.connect(lpf);lpf.connect(dGain);dGain.connect(aCtx.destination);
    dNode.start();
  }catch(e){}
}
function updateAudio(){
  if(!dGain) return;
  const d=dread(gt),tgt=Math.max(0,(d-0.28)*0.042);
  dGain.gain.linearRampToValueAtTime(tgt,aCtx.currentTime+2);
  if(dNode) dNode.frequency.linearRampToValueAtTime(38+d*30,aCtx.currentTime+3);
}
setInterval(updateAudio,2500);

// ── Day counter ───────────────────────────────────────────────────────────────
let prevGt=0.25;

// ── Main loop ─────────────────────────────────────────────────────────────────
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05);last=ts;
  if(running){
    const adv=(spd*dt)/REAL_DAY_S;
    const newGt=(gt+adv)%1;
    if(newGt<gt){day++;season=Math.floor(day/7)%4;}
    gt=newGt;prevGt=gt;
    tickWx(dt*spd);
    updateParts();
    movePL(dt);

    const p=getP(gt);
    const gc=h2r(p.am);

    drawSky(p);
    drawGround(gc,p);
    drawStructs(gc,p);
    drawTrees(gc);
    drawPlayer(gc,p);
    drawParts(p);
    drawVignette(dread(gt));
    drawTiltShift();
    hudUpdate(p);
  }
  requestAnimationFrame(loop);
}

// ── Start ─────────────────────────────────────────────────────────────────────
function startGame(){
  const intro=document.getElementById('intro');
  intro.classList.add('gone');
  setTimeout(()=>{try{intro.remove();}catch(e){}},1300);
  initAudio();running=true;spawnParts();wxT=80;
}
document.getElementById('sbtn').addEventListener('touchstart',e=>{e.preventDefault();startGame();},{passive:false});
document.getElementById('sbtn').addEventListener('click',startGame);

setupDpad();setupSpd();
requestAnimationFrame(loop);
</script>
